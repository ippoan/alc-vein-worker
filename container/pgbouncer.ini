; staging の alc-vein Worker が繋ぐ PgBouncer (Refs ippoan/rust-alc-api#691)。
; 本番の Supabase のプーラー (6543) と同じ transaction mode。トランザクションが終わるたびに
; サーバー側のコネクションが別のクライアントへ回るので、session スコープの set_config は
; 漏れる / 行ゼロになる。worker の repo はトランザクション単位の set_config(..., true) で
; これを避けている (src/repo.rs)。
[databases]
postgres = host=127.0.0.1 port=5432 dbname=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = trust
auth_file = /tmp/pgbouncer-userlist.txt
pool_mode = transaction
; 同時 20 本のテストでもサーバー側は 4 本に絞り、使い回しを必ず起こす
default_pool_size = 4
max_client_conn = 200
; 中継 (VeinDb) の切り損ねで残ったクライアント接続の保険。1 リクエスト 1 接続なので 60 秒も遊ばない
client_idle_timeout = 60
; プーラー側の prepared statement 追跡を切る (Supabase の transaction mode と同じく当てにしない)。
; tokio-postgres の prepare → execute → close は 1 トランザクション内で完結するので通る (ippoan/rust-alc-api#680 段階 A)
max_prepared_statements = 0
ignore_startup_parameters = extra_float_digits,options
