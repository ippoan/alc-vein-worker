[package]
name = "alc-vein"
version = "0.1.0"
edition = "2021"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage)'] }

# vein-match は private repo (ippoan/vein-match)。取得には GitHub の認証が要る:
# ローカルは `gh auth setup-git` 済みであること、CI は
# ippoan/ci-workflows の private-git-auth action が GitHub App の token で git の URL を書き換える
# (Refs ippoan/vein-match#20)。tag を上げるときは Cargo.lock も一緒に更新する。
# vein-match (core) は特徴量の 16 進デコードと読み込み検査 (`decode_hex` / `load`) に、
# vein-match-search は 1:N 照合・テンプレートの組み立てに使う (同じ git の同じ tag)。
[dependencies]
# 出どころは直下の Cargo.toml の [workspace.dependencies] の 1 か所 (ここに git / path を書かない)
alc-core-wasm = { workspace = true }
# テナントの transaction の部品 (`PgClient`・`TenantTx`・`TxOutput`)。`pg` (repo の実装) が使う
alc-worker-db = { workspace = true }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["json"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
# `pg` の Mutex と、`tenant_tx` の閉包が返す BoxFuture
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `pg` が流す型付きの文の型 (`Type`) と `Row`。接続は張らない (runtime の feature を付けない。
# wasm 用の feature `js` は直下の worker と alc-worker-db が付ける)
tokio-postgres = { version = "0.7", default-features = false, features = ["with-chrono-0_4", "with-uuid-1"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
vein-match = { git = "https://github.com/ippoan/vein-match", tag = "v0.1.1" }
vein-match-search = { git = "https://github.com/ippoan/vein-match", tag = "v0.1.1" }

# trait・型・matcher・routes と repo の実装 (`pg`) を持ち、native でも wasm32-unknown-unknown でもビルドできる
# (接続は持たない。張るのは直下の worker と tests/sql_db.rs、Refs ippoan/rust-alc-api#682 / ippoan/rust-alc-api#723)。
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }
# tests/sql_db.rs (実 DB で repo::sql と RLS を確かめる) 用の native の接続 (runtime 付き)。
# dev-dependency なので wasm のビルドには入らない
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1"] }
tower = { version = "0.5", features = ["util"] }
